services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuelpytracker-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    env_file:
      - ./backend/.env
    volumes:
      - fuel-data:/app/data
      - ./backend/.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - fuel-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuelpytracker-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fuel-network

networks:
  fuel-network:
    driver: bridge

volumes:
  fuel-data:
    driver: local