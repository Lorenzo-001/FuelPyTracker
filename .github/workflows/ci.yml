name: CI/CD Pipeline — FuelPyTracker V2

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI (Python 3.11 & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend test suite (Unit & E2E)
        env:
          PYTHONPATH: backend
          LOCAL_SQLITE: "True"
          DEMO_MODE: "True"
        run: |
          pytest backend/tests/ -v --durations=10

  frontend:
    name: Frontend CI (Node 22, Oxlint, TypeScript & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Type check and production build (tsc & vite)
        run: npm run build

  docker-smoke-test:
    name: Docker Compose Build Smoke-Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dummy env for compose validation
        run: |
          touch backend/.env

      - name: Build Docker images with Compose
        run: |
          docker compose build
